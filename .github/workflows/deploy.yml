
name: Deploy website to Majordomo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.MAJORDOMO_SSH_KEY }}
          SSH_KNOWN_HOST: ${{ vars.MAJORDOMO_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/majordomo_key
          chmod 600 ~/.ssh/majordomo_key
          printf '%s\n' "$SSH_KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "Configured SSH host key fingerprint:"
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256

      - name: Upload website
        env:
          SSH_HOST: ${{ vars.MAJORDOMO_HOST }}
          SSH_PORT: ${{ vars.MAJORDOMO_PORT }}
          SSH_USER: ${{ vars.MAJORDOMO_USER }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Deployment attempt $attempt of 5"

            if rsync -avz --itemize-changes \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='docs/' \
              --exclude='README.md' \
              --exclude='.gitignore' \
              -e "ssh -i ~/.ssh/majordomo_key -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1" \
              ./ "$SSH_USER@$SSH_HOST:/home/sevenskybarru/glazounov-ai.ru/www/"; then
              echo "Deployment check succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Connection failed; retrying in 10 seconds"
              sleep 10
            fi
          done

          echo "Deployment failed after 5 attempts"
          exit 1
